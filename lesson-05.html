body{margin:0;padding:12px;background:var(--page);color:var(--fg);font-family:'PPA',Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.6}

#fit:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}

#bar input[type=range]{flex:1;accent-color:var(--ac)}

#cap{min-height:34px;font-size:18px;opacity:.92;padding:4px 6px}

function ensureEnds(){SC.forEach((s,i)=>{s.t1=i<SC.length-1?SC[i+1].t0:1e9})}

// ===== التشغيل =====
let cur=-1,lastT=-9,hx=1750,hy=980,idle={x:1560,y:880};
function idxAt(t){let k=0;SC.forEach((s,i)=>{if(t>=s.t0-.05)k=i});return k}
function render(t){
  const k=idxAt(t),jump=cur<0||Math.abs(t-lastT)>1.2||au.paused;
  if(k!==cur){
    svgs.forEach((sv,i)=>{
      sv.classList.remove('out');sv.style.transition='none';
      if(i===k){sv.style.opacity=1}
      else if(i===k-1&&!jump){sv.style.opacity=1;void sv.getBoundingClientRect();sv.style.transition='';sv.classList.add('out');requestAnimationFrame(()=>{sv.style.opacity=0})}
      else sv.style.opacity=0;
    });
    cur=k;
  }
  lastT=t;
  const s=SC[k];let pen=null,pt0=-1;
  s.ops.forEach(op=>{
    op.upd(t);
    if(t>=op.t0-.3&&t<=op.t0+op.dur+.12&&op.t0>pt0){
      pt0=op.t0;const p=(t-op.t0)/op.dur;pen=op.at(cl(p));
      if(op.k==='fill'||op.k==='text'){pen=[pen[0],pen[1]+Math.sin(t*9)*2]}
    }
  });
  let tx,ty;
  if(pen&&!au.paused||pen&&Math.abs(t-lastT)<.2){tx=pen[0];ty=pen[1]}else if(pen){tx=pen[0];ty=pen[1]}else{tx=idle.x;ty=idle.y}
  if(au.paused||jump&&!pen){hx=tx;hy=ty}else{hx+=(tx-hx)*.38;hy+=(ty-hy)*.38}
  hand.style.transform=`translate(${hx-TIP.x}px,${hy-TIP.y}px)`;
}
function fmt(x){x=Math.max(0,x);return Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0')}
let capOn=false,lastCap=-1;
function caption(t){if(!capOn)return;let k=-1;CAP.forEach((c,i)=>{if(t>=c[0])k=i});if(k!==lastCap){lastCap=k;$('cap').textContent=k>=0?CAP[k][2]:''}}
function fitStage(){const w=fit.clientWidth,h=fit.clientHeight,s=Math.min(w/1600,h/900);stage.style.transform='translate('+((w-1600*s)/2)+'px,'+((h-900*s)/2)+'px) scale('+s+')'}
addEventListener('resize',fitStage);document.addEventListener('fullscreenchange',()=>setTimeout(fitStage,50));fitStage();
function loop(){const t=au.currentTime;render(t);$('rg').value=t;$('tm').textContent=fmt(t)+' / '+fmt(au.duration||0);caption(t);$('pp').textContent=au.paused?'▶':'⏸';requestAnimationFrame(loop)}
au.addEventListener('loadedmetadata',()=>{$('rg').max=au.duration});
if(au.duration)$('rg').max=au.duration;
const tog=()=>{$('go').hidden=true;au.paused?au.play():au.pause()};
$('go').onclick=tog;$('pp').onclick=tog;
$('rg').oninput=e=>{au.currentTime=+e.target.value;render(au.currentTime)};
$('sp').onchange=e=>au.playbackRate=+e.target.value;
au.addEventListener('ended',()=>{$('go').querySelector('span').textContent='إعادة الدرس ↻';$('go').hidden=false;$('go').onclick=()=>{au.currentTime=0;cur=-1;$('go').hidden=true;au.play()}});
$('cc').onclick=()=>{capOn=!capOn;$('cc').classList.toggle('on',capOn);$('cap').hidden=!capOn;lastCap=-1;if(capOn)caption(au.currentTime)};
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():(fit.requestFullscreen&&fit.requestFullscreen())};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'&&e.target.tagName!=='INPUT'){e.preventDefault();tog()}});
(async()=>{try{await Promise.race([document.fonts.load("700 44px PPA","ابجد"),new Promise(r=>setTimeout(r,1500))])}catch(e){}
 build(B);ensureEnds();render(0);window.READY=true;loop()})();
